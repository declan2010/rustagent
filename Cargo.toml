[package]
name = "rustagent"
version = "0.11.0"
edition = "2024"
description = "A Rust clone of MinAgent: a terminal coding agent for OpenAI-compatible and Ollama endpoints"

[dependencies]
anyhow = "1"
futures-util = "0.3"
libc = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
terminal_size = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process", "io-std", "net", "signal"] }
unicode-width = "0.2"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
